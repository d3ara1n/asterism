name: Release

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      source_tag:
        description: Published prerelease tag to promote
        type: string
        default: ""
    secrets:
      MAC_SIGNING_P12:
        required: true
      MAC_SIGNING_P12_PASSWORD:
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.collect.outputs.skip }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: npm
      - name: Collect pull requests and published versions
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag || '' }}
        run: |
          mode=prerelease
          if [[ -n "$SOURCE_TAG" ]]; then mode=release; fi
          node scripts/collect-release.ts "$mode" "$SOURCE_TAG"
      - if: steps.collect.outputs.skip != 'true'
        run: npm ci
      - id: version
        if: steps.collect.outputs.skip != 'true'
        run: node scripts/prepare-release.ts
      - if: steps.collect.outputs.skip != 'true'
        run: npm run typecheck
      - if: steps.collect.outputs.skip != 'true'
        run: npm test
      - if: steps.collect.outputs.skip != 'true'
        run: npm run i18n:check
      - uses: actions/upload-artifact@v4
        if: steps.collect.outputs.skip != 'true'
        with:
          name: notes
          path: .local/release/notes.md
          include-hidden-files: true
          if-no-files-found: error

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: windows-2025
            platform: win
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: npm
      - run: npm ci
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
      - name: Import macOS signing identity
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAC_SIGNING_P12"
          test -n "$MAC_SIGNING_P12_PASSWORD"
          signing="$RUNNER_TEMP/atelier-signing"
          mkdir -p "$signing"
          printf '%s' "$MAC_SIGNING_P12" | base64 --decode > "$signing/identity.p12"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$signing/build.keychain-db"
          security set-keychain-settings -lut 21600 "$signing/build.keychain-db"
          security unlock-keychain -p "$keychain_password" "$signing/build.keychain-db"
          security import "$signing/identity.p12" -k "$signing/build.keychain-db" \
            -P "$MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$signing/build.keychain-db"
          security list-keychains -d user -s "$signing/build.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          security find-certificate -a -p "$signing/build.keychain-db" > "$signing/identity.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$signing/build.keychain-db" "$signing/identity.pem"
          identity="$(security find-identity -v -p codesigning "$signing/build.keychain-db" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
          test -n "$identity"
          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"
      - name: Build distributables
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: npm run make -- "--$RELEASE_PLATFORM" "--$RELEASE_ARCH"
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict out/mac-arm64/Atelier.app
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            out/*.dmg
            out/*.zip
            out/*.exe
            out/*.AppImage
            out/*.blockmap
            out/latest*.yml
      - name: Remove macOS signing identity
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/atelier-signing/build.keychain-db" || true
          rm -rf "$RUNNER_TEMP/atelier-signing"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: release-notes
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          flags=()
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$tag" artifacts/* --draft --target "$RELEASE_SHA" \
            --title "Atelier $tag" --notes-file release-notes/notes.md "${flags[@]}"
          gh release edit "$tag" --draft=false
