name: CI

on:
  workflow_dispatch:
    inputs:
      plugin_integration:
        description: Run plugin build/load integration tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Plugin build/load integration tests
        if: inputs.plugin_integration
        run: npm run test:plugins
      - run: npm run i18n:check
      - run: npm run build
